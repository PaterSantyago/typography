name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release and publish
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release from main and publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Verify release tag
        id: release
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          package_version="$(node -p "require('./package.json').version")"

          if [[ ! "$tag" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Tag must be a semver tag, with optional v prefix. Got: $tag" >&2
            exit 1
          fi

          if [ "$version" != "$package_version" ]; then
            echo "Tag version $version does not match package.json version $package_version" >&2
            exit 1
          fi

          git fetch origin main:refs/remotes/origin/main
          tag_sha="$(git rev-list -n 1 "$tag")"

          if ! git merge-base --is-ancestor "$tag_sha" origin/main; then
            echo "Tag $tag ($tag_sha) must point to a commit contained in origin/main" >&2
            exit 1
          fi

          prerelease="${version#*-}"

          if [ "$prerelease" = "$version" ]; then
            npm_tag="latest"
            github_prerelease="false"
          else
            npm_tag="${prerelease%%.*}"
            github_prerelease="true"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag_sha=$tag_sha" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$npm_tag" >> "$GITHUB_OUTPUT"
          echo "github_prerelease=$github_prerelease" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate package
        run: pnpm run ci

      - name: Check npm publication
        id: npm
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          version="${{ steps.release.outputs.version }}"

          if npm view "$package_name@$version" version >/dev/null 2>&1; then
            echo "$package_name@$version is already published"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "$package_name@$version is not published yet"
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package
        if: steps.npm.outputs.published != 'true'
        run: pnpm publish --access public --provenance --no-git-checks --tag "${{ steps.release.outputs.npm_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.release.outputs.tag }}"
          args=(
            release create "$tag"
            --target "${{ steps.release.outputs.tag_sha }}"
            --title "$tag"
            --generate-notes
          )

          if [ "${{ steps.release.outputs.github_prerelease }}" = "true" ]; then
            args+=(--prerelease)
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub release $tag already exists"
          else
            gh "${args[@]}"
          fi
